
[package]
name = "freenet-ping-app"
version = "0.1.11"
edition = "2021"

[features]
testing = ["freenet-stdlib/testing", "freenet/testing"]

[dependencies]
anyhow = "1.0"
chrono = { workspace = true, features = ["default"] }
clap = { version = "4.4", features = ["derive"] }
freenet-stdlib = { version = "0.1.11", features = ["net"] }
freenet-ping-types = { path = "../types", features = ["std", "clap"] }
futures = "0.3.31"
once_cell = "1.18.0"
rand = "0.8.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.9.0"
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = "0.26.1"
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
humantime = "2.2.0"
circom-prover = { version = "0.1.2", features = ["circom-witnesscalc"]}
circom-scotia = { path = "../../circom-scotia" }
ff = "0.13.1"
pasta_curves = "0.5.1"
bellpepper-core = "0.4.0"
bellman = "0.14.0"
nova-snark = "0.41.0"
bls12_381 = "0.8.0"
pairing = "0.23.0"
sha2 = "0.10.9"
ark-circom = "0.5.0"
ark-bn254 = "0.5.0"
ark-crypto-primitives = "0.5.0"
ark-groth16 = "0.5.0"
ark-std = "0.5.0"
ark-vesta = "=0.5.0"
arecibo = "0.1.1"
nova-scotia = "0.5.0"

[dev-dependencies]
freenet = { version = "*" }
testresult = { workspace = true }

[lib]
name = "freenet_ping_app"
path = "src/lib.rs"

[[bin]]
name = "freenet-ping"
path = "src/main.rs"
